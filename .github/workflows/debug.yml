name: "🔍 Horizon 诊断"

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: "🔍 1. 检查 Secret"
        run: |
          if [ -n "${{ secrets.HORIZON_WEBHOOK_URL }}" ]; then
            echo "✅ HORIZON_WEBHOOK_URL 存在"
          else
            echo "❌ HORIZON_WEBHOOK_URL 不存在"
          fi

      - name: "🔍 2. 测试 Webhook"
        run: |
          echo "发送测试消息..."
          curl -X POST "${{ secrets.HORIZON_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"🧪 诊断测试"}}' \
            -w "\nHTTP状态码: %{http_code}\n"

      - name: "🔍 3. 查看配置"
        run: |
          echo "=== config.github.json ==="
          cat data/config.github.json
          echo "========================="

      - name: "🔍 4. 运行 Horizon"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          uv run horizon --hours 24 2>&1 | tee horizon.log

      - name: "🔍 5. 显示日志"
        if: always()
        run: |
          echo "=== 最后100行日志 ==="
          tail -100 horizon.log
          echo "====================="
          echo ""
          echo "=== 搜索 Webhook ==="
          grep -i webhook horizon.log || echo "未找到"
          echo ""
          echo "=== 搜索 Error ==="
          grep -i error horizon.log || echo "未找到"
